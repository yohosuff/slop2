<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
    <meta name="description" content="Prison Escape - A top-down stealth game">
    <meta name="theme-color" content="#1a1a1a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Prison Escape">
    <title>Prison Escape</title>
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="game-container">
        <canvas id="game-canvas"></canvas>
        <div id="ui">
            <div id="status">Keys: <span id="key-count">0</span>/3</div>
            <div id="controls-hint">Use arrow keys or touch to move</div>
        </div>
        <div id="game-over" class="hidden">
            <h2 id="game-over-text">Game Over</h2>
            <button id="restart-btn">Restart</button>
        </div>
    </div>
    <script src="js/game.js"></script>
</body>
</html>
