<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#2c3e50">
    <meta name="description" content="Maze Escape - Navigate through the maze to find the exit!">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Maze Escape">
    <link rel="manifest" href="manifest.json">
    <title>Maze Escape</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="game-container">
        <div class="header">
            <h1>Maze Escape</h1>
            <div class="controls">
                <button id="new-game-btn" class="btn">New Game</button>
                <div class="timer">Time: <span id="timer">0:00</span></div>
            </div>
        </div>
        <canvas id="game-canvas"></canvas>
        <div class="instructions">
            <p class="desktop-hint">Use arrow keys or WASD to move</p>
            <p class="mobile-hint">Swipe to move</p>
        </div>
        <div id="win-modal" class="modal hidden">
            <div class="modal-content">
                <h2>🎉 You Escaped!</h2>
                <p>Time: <span id="final-time"></span></p>
                <button id="play-again-btn" class="btn">Play Again</button>
            </div>
        </div>
    </div>
    <script src="js/game.js"></script>
</body>
</html>
